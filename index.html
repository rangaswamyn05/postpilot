<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#201C18;--bg:#F9F6EF;--surf:#fff;--line:#E3DDD0;--muted:#6B6F7C;--acc:#7A5A1C;--tint:#F5EBD1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.45}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0 0 8px}
h1{font-size:28px}h2{font-size:22px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:18px}
.step{color:var(--muted);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:4px;margin:8px 0 22px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
p{margin:0 0 14px}.muted{color:var(--muted);font-size:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.opt.sel{border-color:var(--acc);background:var(--tint)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt b{display:block}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;font:700 16px Manrope,sans-serif;padding:15px;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);margin-top:10px}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px}
.foot div{max-width:560px;margin:0 auto}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.count{display:flex;gap:8px;align-items:center}
.count button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.count input{text-align:center;font-size:22px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .t{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd;cursor:pointer;border:3px solid transparent}
.grid .t img{width:100%;height:100%;object-fit:cover;display:block}
.grid .t.on{border-color:var(--acc)}
.grid .t.on::after{content:"✓";position:absolute;right:4px;top:4px;background:var(--acc);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:600 14px Manrope;cursor:pointer}
.tabs button.on{background:var(--tint);border-color:var(--acc)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ba canvas{width:100%;border-radius:10px;background:#ddd}
.ba span{font-size:12px;color:var(--muted)}
.slides{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.slides canvas{height:220px;width:auto;border-radius:10px;flex:none}
.pill{display:inline-block;background:var(--tint);color:var(--acc);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.stars{display:flex;gap:6px;font-size:32px;cursor:pointer;margin:8px 0}
.stars span{color:var(--line)}.stars span.on{color:#C8941E}
.modal{position:fixed;inset:0;background:rgba(32,28,24,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.modal .card{max-width:420px;width:100%;padding:20px}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.err{color:#a33;font-size:14px;margin-bottom:10px}
label.f{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.sl{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MAX_EDIT=2048, THUMB=360;
const FEEDBACK_URL=""; // set to a backend endpoint later; until then feedback is kept in this browser

const S={
  authed:false, mode:'edit', source:null, photos:[], count:0, picked:[],
  styleIdx:0, params:null, ref:null, changes:0, route:[], ri:0,
  biz:'Photography studio', bizName:'', edited:[], tab:'picked'
};
const PRESETS=[
  {name:'Clean and bright',p:{exp:.10,con:.12,sat:.08,warm:.02}},
  {name:'Warm film',p:{exp:.04,con:.10,sat:-.05,warm:.14}},
  {name:'Moody',p:{exp:-.08,con:.22,sat:-.10,warm:-.04}},
  {name:'Soft and airy',p:{exp:.16,con:-.05,sat:-.06,warm:.04}}
];
const STEPS={
  login:'Sign in', about:'Welcome', mode:'What do you want?', connect:'Your photos',
  choose:'How many', style:'Edit style', review:'Review', sample:'Sample edit', results:'Your content'
};

/* ---------- image processing (all in the browser) ---------- */
async function bitmapOf(file){return createImageBitmap(file,{imageOrientation:'from-image'})}
function drawContain(bmp,maxSide){
  const k=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c;
}
function drawCover(src,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const sw=src.width,sh=src.height,k=Math.max(W/sw,H/sh),w=sw*k,h=sh*k;
  c.getContext('2d').drawImage(src,(W-w)/2,(H-h)/2,w,h);return c;
}
function stats(cv){
  const w=Math.min(160,cv.width),h=Math.round(cv.height*w/cv.width);
  const t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d');x.drawImage(cv,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let n=w*h,sL=0,sS=0,sRB=0;const L=new Float32Array(n);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const r=d[i],g=d[i+1],b=d[i+2],l=.299*r+.587*g+.114*b;L[j]=l;sL+=l;
    sS+=Math.max(r,g,b)-Math.min(r,g,b);sRB+=r-b;
  }
  const m=sL/n;let v=0;for(let j=0;j<n;j++)v+=(L[j]-m)**2;
  return {mean:m,std:Math.sqrt(v/n)||1,sat:sS/n||1,rb:sRB/n};
}
function sharpScore(cv){ // variance of Laplacian on a small grey copy
  const w=200,h=Math.max(8,Math.round(cv.height*w/cv.width));
  const t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d');x.drawImage(cv,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
  for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
  let s=0,s2=0,n=0,sum=0;
  for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){
    const k=y*w+xx,l=4*g[k]-g[k-1]-g[k+1]-g[k-w]-g[k+w];s+=l;s2+=l*l;n++;
  }
  for(let j=0;j<g.length;j++)sum+=g[j];
  const mean=sum/g.length,sharp=s2/n-(s/n)**2;
  const expo=1-Math.min(1,Math.abs(mean-125)/125); // 1 = well exposed
  return {sharp,expo};
}
function dhash(cv){
  const t=document.createElement('canvas');t.width=9;t.height=8;
  const x=t.getContext('2d');x.drawImage(cv,0,0,9,8);const d=x.getImageData(0,0,9,8).data;
  const bits=[];for(let y=0;y<8;y++)for(let xx=0;xx<8;xx++){
    const a=d[(y*9+xx)*4]+d[(y*9+xx)*4+1]+d[(y*9+xx)*4+2],b=d[(y*9+xx+1)*4]+d[(y*9+xx+1)*4+1]+d[(y*9+xx+1)*4+2];
    bits.push(a>b?1:0);}
  return bits;
}
const ham=(a,b)=>{let n=0;for(let i=0;i<64;i++)if(a[i]!==b[i])n++;return n};
function applyEdit(cv,p){
  const x=cv.getContext('2d'),im=x.getImageData(0,0,cv.width,cv.height),d=im.data;
  const e=1+p.exp,c=1+p.con,s=1+p.sat,wm=p.warm*40;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]*e,g=d[i+1]*e,b=d[i+2]*e;
    r=(r-128)*c+128;g=(g-128)*c+128;b=(b-128)*c+128;
    const l=.299*r+.587*g+.114*b;
    r=l+(r-l)*s;g=l+(g-l)*s;b=l+(b-l)*s;
    r+=wm;b-=wm;
    d[i]=r<0?0:r>255?255:r;d[i+1]=g<0?0:g>255?255:g;d[i+2]=b<0?0:b>255?255:b;
  }
  x.putImageData(im,0,0);return cv;
}
function paramsFromRef(refStats,srcStats){
  return {
    exp:clamp((refStats.mean-srcStats.mean)/255*.9,-.3,.3),
    con:clamp(refStats.std/srcStats.std-1,-.3,.4),
    sat:clamp(refStats.sat/srcStats.sat-1,-.35,.4),
    warm:clamp((refStats.rb-srcStats.rb)/255*1.2,-.2,.25)
  };
}
const toBlob=(cv,q=.9)=>new Promise(r=>cv.toBlob(r,'image/jpeg',q));

/* ---------- tiny zip writer (store only) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
async function makeZip(files){ // files:[{name,blob}]
  const parts=[],cen=[];let off=0;const enc=new TextEncoder();
  for(const f of files){
    const data=new Uint8Array(await f.blob.arrayBuffer()),nm=enc.encode(f.name),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);off+=30+nm.length+data.length;
  }
  const csz=cen.reduce((a,b)=>a+(b.byteLength??b.length),0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,csz,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ---------- caption (template based, no AI call) ---------- */
function captionText(){
  const n=S.bizName?S.bizName+': ':'';
  const T={
    'Photography studio':`${n}Every frame has a story. Here is a little of our latest shoot. Which moment would you never want to forget? 📸`,
    'Restaurant':`${n}Fresh from our kitchen this week. Which dish should we put on the table for you next? 🍽️`,
    'Salon or spa':`${n}A fresh look, a fresh start. Which style are you trying next? ✨`,
    'Boutique or shop':`${n}New pieces, new favourites. Which one would you wear first? 🛍️`,
    'Other business':`${n}A look at what we have been working on. What would you like to see more of? 💬`
  };
  return T[S.biz]||T['Other business'];
}

/* ---------- routing ---------- */
function buildRoute(){
  if(S.source==='upload') S.route=['style','sample','results'];
  else if(S.mode==='select') S.route=['choose','review','results'];
  else S.route=['choose','style','review','sample','results'];
  S.ri=0;
}
const cur=()=>S.screen;
function go(name){S.screen=name;render()}
function next(){
  if(S.screen==='about')return go('mode');
  if(S.screen==='mode')return go('connect');
  if(S.screen==='connect'){buildRoute();return go(S.route[0])}
  S.ri++;go(S.route[S.ri]);
}
function back(){
  if(S.screen==='mode')return go('about');
  if(S.screen==='connect')return go('mode');
  if(S.ri>0){S.ri--;return go(S.route[S.ri])}
  if(S.route.length&&S.ri===0)return go('connect');
}
function progress(){
  const flow=['about','mode','connect',...(S.route.length?S.route:['choose','style','review','sample','results'])];
  const i=flow.indexOf(S.screen);return {i:i+1,n:flow.length};
}

/* ---------- screens ---------- */
function shell(inner,{title,sub,btn,onNext,canNext=true,back:b=true}){
  const pr=progress();
  const root=$('#app');root.innerHTML='';
  const w=el(`<div>
    <div class="top"><span class="brand">PostPilot</span><span class="step">Step ${pr.i} of ${pr.n}</span></div>
    <div class="bar"><i style="width:${pr.i/pr.n*100}%"></i></div>
    <h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}
    <div id="body"></div></div>`);
  $('#body',w).appendChild(inner);root.appendChild(w);
  if(btn){
    const f=el(`<div class="foot"><div><button class="btn" id="nx" ${canNext?'':'disabled'}>${btn}</button>${b?'<button class="btn ghost" id="bk">Back</button>':''}</div></div>`);
    root.appendChild(f);
    $('#nx',f).onclick=onNext||next;
    if(b)$('#bk',f).onclick=back;
  }
}
function opt(title,desc,sel,onclick,dis){
  const b=el(`<button class="card opt ${sel?'sel':''}" ${dis?'disabled':''}><div><b>${title}</b><span class="muted">${desc}</span></div></button>`);
  if(!dis)b.onclick=onclick;return b;
}

const screens={
login(){
  const d=el(`<div>
    <p class="muted">Demo account for reviewers: <b>demo@postpilot.app</b> / <b>PostPilot2026</b></p>
    <label class="f">Email</label><input type="email" id="em" value="demo@postpilot.app">
    <label class="f">Password</label><input type="password" id="pw">
    <div class="err" id="er"></div>
    <button class="btn" id="go">Sign in</button></div>`);
  $('#go',d).onclick=()=>{
    if($('#em',d).value.trim().toLowerCase()==='demo@postpilot.app'&&$('#pw',d).value==='PostPilot2026'){S.authed=true;go('about')}
    else $('#er',d).textContent='Wrong email or password. Use the demo account above.';
  };
  $('#pw',d).addEventListener('keydown',e=>{if(e.key==='Enter')$('#go',d).click()});
  const root=$('#app');root.innerHTML='';
  const w=el(`<div><div class="top"><span class="brand">PostPilot</span></div><h1>Turn a big shoot into posts, ready to publish</h1><p class="muted">Pick your best photos, edit them in one look, and get content for Instagram.</p><div id="b"></div></div>`);
  $('#b',w).appendChild(d);root.appendChild(w);
},
about(){
  shell(el(`<div>
    <div class="card"><b>1. Shortlist</b><p class="muted" style="margin:0">Tell us how many photos to keep from hundreds or thousands.</p></div>
    <div class="card"><b>2. Edit in one look</b><p class="muted" style="margin:0">Optional. Sliders on your real photo, never repainted.</p></div>
    <div class="card"><b>3. Get content</b><p class="muted" style="margin:0">A carousel, a captioned post, ready to post. Caption ends with a question.</p></div>
    <p class="muted">Your photos stay in your browser. Nothing is uploaded to a server in this version.</p></div>`),
    {title:'Your photos, ready to post',btn:'Get started',back:false});
},
mode(){
  const d=el('<div></div>');
  d.append(opt('Shortlist and edit','Pick the best photos, then edit them in one professional look.',S.mode==='edit',()=>{S.mode='edit';render()}),
           opt('Shortlist only','Just pick the best photos. No editing.',S.mode==='select',()=>{S.mode='select';render()}));
  shell(d,{title:'What do you want us to do?',btn:'Continue'});
},
connect(){
  const d=el('<div></div>');
  d.append(
    opt('Google Drive','Coming next version',false,null,true),
    opt('Dropbox','Coming next version',false,null,true),
    opt('This device','A folder on your computer: local drive, hard disk or SD card',S.source==='device',()=>pickFiles('device')),
    opt('Upload','Select and upload photos for editing. We skip the shortlist.',S.source==='upload',()=>pickFiles('upload'))
  );
  const info=el(`<div id="inf" class="muted">${S.photos.length?`<span class="pill">${S.photos.length} photos ready</span>`:''}</div>`);
  d.append(info);
  shell(d,{title:'Where are your photos?',sub:'Hundreds or thousands is fine. We make small previews in your browser.',btn:'Continue',canNext:S.photos.length>0});
},
choose(){
  const N=S.photos.length;if(!S.count)S.count=Math.min(N,Math.max(1,Math.round(N*.1)));
  const d=el(`<div><div class="card">
    <label class="f">How many photos do you want to keep?</label>
    <div class="count"><button id="m">−</button><input type="number" id="hn" inputmode="numeric" min="1" max="${N}" value="${S.count}"><button id="p">+</button></div>
    <p class="muted" style="margin:8px 0 0">of ${N.toLocaleString()} photos</p></div>
    <p class="muted">Type any number. We rank by sharpness and exposure and skip near-duplicates.</p></div>`);
  const inp=$('#hn',d),set=v=>{S.count=clamp(Math.round(+v)||1,1,N);inp.value=S.count};
  $('#m',d).onclick=()=>set(S.count-1);$('#p',d).onclick=()=>set(S.count+1);inp.onchange=()=>set(inp.value);
  shell(d,{title:'How many photos?',btn:'Continue',onNext:()=>{set(inp.value);next()}});
},
style(){
  const d=el('<div></div>');
  PRESETS.forEach((p,i)=>d.append(opt(p.name,`Exposure ${fmt(p.p.exp)} · Contrast ${fmt(p.p.con)} · Colour ${fmt(p.p.sat)} · Warmth ${fmt(p.p.warm)}`,!S.ref&&S.styleIdx===i,()=>{S.styleIdx=i;S.ref=null;S.params={...p.p};render()})));
  const r=el(`<div class="card"><b>Have a reference? (optional)</b><p class="muted" style="margin:4px 0 8px">Upload a photo or screenshot of a look you love. We match its brightness, contrast, colour and warmth.</p>
    <input type="file" accept="image/*" id="rf">${S.ref?'<span class="pill">Reference set</span>':''}</div>`);
  $('#rf',r).onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    S.ref=stats(drawContain(await bitmapOf(f),400));S.params=null;render();
  };
  d.append(r);
  if(!S.params&&!S.ref)S.params={...PRESETS[S.styleIdx].p};
  shell(d,{title:'Pick an edit style',sub:'One professional look for the whole shoot.',btn:'Continue'});
},
review(){
  const pk=new Set(S.picked);
  const d=el('<div></div>');
  d.append(el(`<div class="tabs"><button class="${S.tab==='picked'?'on':''}" id="t1">Picked (${pk.size})</button><button class="${S.tab==='all'?'on':''}" id="t2">All photos (${S.photos.length})</button></div>`));
  $('#t1',d).onclick=()=>{S.tab='picked';render()};$('#t2',d).onclick=()=>{S.tab='all';render()};
  const list=S.tab==='picked'?S.photos.filter(p=>pk.has(p.id)):S.photos.slice(0,300);
  const g=el('<div class="grid"></div>');
  list.forEach(p=>{
    const t=el(`<div class="t ${pk.has(p.id)?'on':''}"><img loading="lazy" src="${p.url}" alt=""></div>`);
    t.onclick=()=>{pk.has(p.id)?S.picked=S.picked.filter(i=>i!==p.id):S.picked.push(p.id);render()};g.append(t);
  });
  d.append(g);
  if(S.tab==='all'&&S.photos.length>300)d.append(el('<p class="muted">Showing the first 300. Use Picked to review your shortlist.</p>'));
  shell(d,{title:'Review your picks',sub:'Tap a photo to add or remove it.',btn:'Continue',canNext:S.picked.length>0});
},
sample(){
  const d=el(`<div><div class="ba"><div><canvas id="b0"></canvas><span>Before</span></div><div><canvas id="b1"></canvas><span>After</span></div></div>
    <p class="muted" id="cm"></p><button class="btn ghost" id="tr" style="margin-top:0">Not right? Try another (up to 3 changes)</button></div>`);
  shell(d,{title:'Your sample edit',sub:'Check one photo before we edit them all.',btn:'Looks good, edit all',onNext:next});
  renderSample();
  $('#tr').onclick=()=>{
    if(S.changes>=3)return;
    S.changes++;S.ref=null;S.styleIdx=(S.styleIdx+1)%PRESETS.length;S.params={...PRESETS[S.styleIdx].p};renderSample();
  };
},
results(){renderResults()}
};
const fmt=v=>(v>=0?'+':'')+Math.round(v*100);

async function pickFiles(kind){
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='image/*';
  if(kind==='device'){inp.webkitdirectory=true}
  inp.onchange=()=>{const fs=[...inp.files].filter(f=>f.type.startsWith('image/'));if(fs.length)ingest(fs,kind)};
  inp.click();
}
async function ingest(files,kind){
  S.source=kind;S.photos.forEach(p=>URL.revokeObjectURL(p.url));S.photos=[];S.picked=[];S.count=0;S.changes=0;
  const root=$('#app');
  const m=el(`<div class="modal"><div class="card"><b>Making previews</b><p class="muted" id="pm">0 of ${files.length}</p><div class="prog"><i id="pb"></i></div></div></div>`);
  root.append(m);
  for(let i=0;i<files.length;i++){
    try{
      const b=await bitmapOf(files[i]),cv=drawContain(b,THUMB);b.close&&b.close();
      const sc=sharpScore(cv),blob=await toBlob(cv,.7);
      S.photos.push({id:i,name:files[i].name,file:files[i],url:URL.createObjectURL(blob),sharp:sc.sharp,expo:sc.expo,hash:dhash(cv)});
    }catch(e){/* skip unreadable file */}
    if(i%5===0||i===files.length-1){$('#pm').textContent=`${i+1} of ${files.length}`;$('#pb').style.width=((i+1)/files.length*100)+'%';await new Promise(r=>setTimeout(r));}
  }
  m.remove();
  if(kind==='upload'){S.picked=S.photos.map(p=>p.id);S.mode='edit'}
  render();
}
function rank(){
  const N=S.photos.length,k=Math.min(S.count,N);
  const sh=[...S.photos].sort((a,b)=>a.sharp-b.sharp),pc=new Map(sh.map((p,i)=>[p.id,i/(N-1||1)]));
  const sc=p=>pc.get(p.id)*.7+p.expo*.3;
  const sorted=[...S.photos].sort((a,b)=>sc(b)-sc(a)),out=[],rest=[];
  for(const p of sorted){
    if(out.length<k&&!out.some(q=>ham(q.hash,p.hash)<=6))out.push(p);else rest.push(p);
  }
  for(const p of rest){if(out.length>=k)break;out.push(p)}
  return out.map(p=>p.id);
}
async function sourceBitmap(p){return bitmapOf(p.file)}
async function renderSample(){
  const p=S.photos.find(x=>x.id===S.picked[0]);if(!p)return;
  const bmp=await sourceBitmap(p),a=drawContain(bmp,800);bmp.close&&bmp.close();
  const st=stats(a);if(S.ref)S.params=paramsFromRef(S.ref,st);
  const b=document.createElement('canvas');b.width=a.width;b.height=a.height;b.getContext('2d').drawImage(a,0,0);
  applyEdit(b,S.params);
  [['b0',a],['b1',b]].forEach(([id,cv])=>{const c=$('#'+id);if(!c)return;c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0)});
  const nm=S.ref?'Your reference':PRESETS[S.styleIdx].name;
  const cm=$('#cm');if(cm)cm.innerHTML=`Style: <b>${nm}</b> · Changes used: ${S.changes} of 3`;
  const tr=$('#tr');if(tr)tr.disabled=S.changes>=3;
}
async function renderResults(){
  const root=$('#app');root.innerHTML='';
  const wantEdit=S.mode==='edit';
  const w=el(`<div><div class="top"><span class="brand">PostPilot</span><span class="step">Done</span></div><div class="bar"><i style="width:100%"></i></div>
    <h1>Recommended content, generated from your photos</h1><div id="rs"><div class="card"><b>${wantEdit?'Editing your photos':'Preparing your photos'}</b><p class="muted" id="pm">0 of ${S.picked.length}</p><div class="prog"><i id="pb"></i></div></div></div></div>`);
  root.append(w);
  const ids=S.picked,list=ids.map(id=>S.photos.find(p=>p.id===id));
  S.edited=[];let refParams=S.params;
  for(let i=0;i<list.length;i++){
    const bmp=await sourceBitmap(list[i]);let cv=drawContain(bmp,MAX_EDIT);bmp.close&&bmp.close();
    if(wantEdit){const p=S.ref?paramsFromRef(S.ref,stats(cv)):refParams;applyEdit(cv,p)}
    S.edited.push({name:list[i].name.replace(/\.[^.]+$/,'')+'-edited.jpg',cv});
    $('#pm').textContent=`${i+1} of ${list.length}`;$('#pb').style.width=((i+1)/list.length*100)+'%';
    await new Promise(r=>setTimeout(r));
  }
  const car=S.edited.slice(0,5).map(e=>drawCover(e.cv,1080,1350));
  const cap=drawCover(S.edited[S.edited.length>1?1:0].cv,1080,1350);
  S.content={car,cap};
  const rs=$('#rs');rs.innerHTML='';
  rs.append(el(`<div class="card"><span class="pill">Carousel</span><p class="muted" style="margin:6px 0">${car.length} photo${car.length>1?'s':''}. Swipe post for Instagram.</p><div class="slides" id="sl"></div></div>`));
  car.forEach(c=>{const v=document.createElement('canvas');v.width=c.width;v.height=c.height;v.getContext('2d').drawImage(c,0,0);$('#sl').append(v)});
  const cc=el(`<div class="card"><span class="pill">Captioned photo</span><div style="margin:8px 0" id="cp"></div>
    <label class="f">Business type</label><select id="bz">${['Photography studio','Restaurant','Salon or spa','Boutique or shop','Other business'].map(x=>`<option ${x===S.biz?'selected':''}>${x}</option>`).join('')}</select>
    <label class="f">Business name (optional)</label><input type="text" id="bn" value="${S.bizName}" placeholder="Your business">
    <label class="f">Caption</label><textarea id="ct" rows="4">${captionText()}</textarea></div>`);
  rs.append(cc);
  const v=document.createElement('canvas');v.width=cap.width;v.height=cap.height;v.getContext('2d').drawImage(cap,0,0);v.style.cssText='width:100%;border-radius:10px';$('#cp',cc).append(v);
  const upd=()=>{S.biz=$('#bz').value;S.bizName=$('#bn').value;$('#ct').value=captionText()};
  $('#bz').onchange=upd;$('#bn').oninput=upd;
  rs.append(el('<div class="card"><span class="pill">Photo reel with music</span><p class="muted" style="margin:6px 0 0">Coming in the next version.</p></div>'));
  rs.append(el(`<p class="muted">${S.edited.length} ${wantEdit?'edited ':''}photos ready in full quality.</p>`));
  const dl=el('<button class="btn" id="dl">Download everything</button>');rs.append(dl);
  const nw=el('<button class="btn ghost" id="nw">Start a new shoot</button>');rs.append(nw);
  nw.onclick=()=>{S.photos.forEach(p=>URL.revokeObjectURL(p.url));Object.assign(S,{photos:[],picked:[],count:0,changes:0,source:null,route:[],edited:[]});go('connect')};
  dl.onclick=async()=>{
    dl.disabled=true;dl.textContent='Packing your files…';
    const files=[];
    for(const e of S.edited)files.push({name:'photos/'+e.name,blob:await toBlob(e.cv,.92)});
    for(let i=0;i<car.length;i++)files.push({name:`carousel/slide-${i+1}.jpg`,blob:await toBlob(car[i],.92)});
    files.push({name:'captioned-post/photo.jpg',blob:await toBlob(cap,.92)});
    files.push({name:'captioned-post/caption.txt',blob:new Blob([$('#ct').value],{type:'text/plain'})});
    save(await makeZip(files),'postpilot-content.zip');
    dl.disabled=false;dl.textContent='Download everything';feedback();
  };
}
function feedback(){
  let stars=0;
  const m=el(`<div class="modal"><div class="card"><h2>How was it?</h2><p class="muted">Your feedback helps us make PostPilot better.</p>
    <div class="stars" id="st">${[1,2,3,4,5].map(i=>`<span data-i="${i}">★</span>`).join('')}</div>
    <textarea id="fc" rows="3" placeholder="Anything we should change? (optional)"></textarea>
    <input type="text" id="fn" placeholder="Your name or business (optional)">
    <button class="btn" id="fs">Send feedback</button><button class="btn ghost" id="fx">Skip</button></div></div>`);
  document.body.append(m);
  $('#st',m).onclick=e=>{const i=+e.target.dataset.i;if(!i)return;stars=i;[...$('#st',m).children].forEach((s,k)=>s.classList.toggle('on',k<i))};
  $('#fx',m).onclick=()=>m.remove();
  $('#fs',m).onclick=async()=>{
    const rec={stars,comment:$('#fc',m).value,who:$('#fn',m).value,photos:S.photos.length,picked:S.picked.length,mode:S.mode,at:new Date().toISOString()};
    try{const a=JSON.parse(localStorage.getItem('pp_feedback')||'[]');a.push(rec);localStorage.setItem('pp_feedback',JSON.stringify(a))}catch(e){}
    if(FEEDBACK_URL){try{await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)})}catch(e){}}
    m.querySelector('.card').innerHTML='<h2>Thank you</h2><p class="muted">Feedback saved.</p><button class="btn" id="ok">Close</button>';
    $('#ok',m).onclick=()=>m.remove();
  };
}

/* ---------- render ---------- */
function render(){
  if(S.screen==='choose'&&!S.picked.length&&S.photos.length){/* ranking happens on leaving choose */}
  if(S.screen==='review'&&!S.picked.length&&S.source!=='upload')S.picked=rank();
  if(S.screen==='style'&&!S.params&&!S.ref)S.params={...PRESETS[S.styleIdx].p};
  (screens[S.screen]||screens.login)();
}
S.screen='login';
render();
</script>
