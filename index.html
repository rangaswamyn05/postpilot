<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>postpilot</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F9F6EF;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:#201C18}a{text-decoration:none;color:inherit}input,textarea,button{font-family:inherit}
@media (min-width:700px){
 #app>div{max-width:680px!important;box-shadow:0 0 0 1px #E3DDD0;padding-left:36px!important;padding-right:36px!important}
 div[style*="repeat(2, minmax(0, 1fr))"]{grid-template-columns:repeat(4,minmax(0,1fr))!important}
 div[style*="repeat(3, minmax(0, 1fr))"]{grid-template-columns:repeat(4,minmax(0,1fr))!important}
 div[style*="width: 346px"]{width:100%!important;height:auto!important;aspect-ratio:346/270}
 div[style*="width: 346px"]>div[style*="width: 346px"]{width:100%!important;height:100%!important}
 div[style*="width: 346px"]>div[style*="width: 2px"]{height:100%!important}
}
@media (min-width:1100px){
 #app>div{max-width:960px!important;padding-left:56px!important;padding-right:56px!important}
 div[style*="repeat(3, minmax(0, 1fr))"]{grid-template-columns:repeat(6,minmax(0,1fr))!important}
 div[style*="width: 346px"]{max-width:720px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
